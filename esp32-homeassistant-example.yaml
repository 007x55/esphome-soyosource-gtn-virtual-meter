substitutions:
  name: soyosource-gtn-virtual-meter
  device_description: "Control a Soyosource GTN inverter from an ESP32 using an MQTT power sensor"
  external_components_source: github://syssi/esphome-soyosource-gtn-virtual-meter@main
  tx_pin: GPIO4
  rx_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: Soyosource GTN virtual meter
  comment: ${device_description}
  project:
    name: "syssi.esphome-soyosource-gtn-virtual-meter"
    version: 2.6.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  - platform: esphome

logger:
  baud_rate: 0
  level: INFO

# The power meter value is received over MQTT. Sonoff R2 remains a separate
# eWeLink device and is not connected to this ESPHome configuration.
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client

uart:
  - id: uart_0
    baud_rate: 4800
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

soyosource_modbus:
  - id: modbus0
    uart_id: uart_0
    name: soyosource_inverter

soyosource_virtual_meter:
  - id: virtualmeter0
    soyosource_modbus_id: modbus0
    power_id: powermeter0
    power_sensor_inactivity_timeout: 20s
    power_demand_calculation: NEGATIVE_MEASUREMENTS_REQUIRED
    min_power_demand: 0
    max_power_demand: 900
    zero_output_on_min_power_demand: true
    power_demand_divider: 1
    buffer: 10
    update_interval: 3s

soyosource_inverter:
  - id: inverter0
    soyosource_modbus_id: modbus0

sensor:
  - platform: mqtt_subscribe
    id: powermeter0
    internal: true
    name: "Instantaneous power consumption"
    topic: "smartmeter/sensor/groundfloor/obis/1-0:16.7.0/255/value"
    unit_of_measurement: W
    device_class: power
    filters:
      - throttle_average: 15s

  - platform: soyosource_virtual_meter
    soyosource_virtual_meter_id: virtualmeter0
    power_demand:
      name: "Soyosource power demand"

  - platform: soyosource_inverter
    soyosource_inverter_id: inverter0
    operation_status_id:
      name: "Soyosource operation status"
      id: operation_status_id0
    battery_voltage:
      name: "Soyosource battery voltage"
    battery_current:
      name: "Soyosource battery current"
    battery_power:
      name: "Soyosource battery power"
    ac_voltage:
      name: "Soyosource AC voltage"
    ac_frequency:
      name: "Soyosource AC frequency"
    temperature:
      name: "Soyosource temperature"

number:
  - platform: soyosource_virtual_meter
    soyosource_virtual_meter_id: virtualmeter0
    buffer:
      name: "Soyosource buffer"
      initial_value: 10
      restore_value: true
    manual_power_demand:
      name: "Soyosource manual power demand"
      max_value: 900
    max_power_demand:
      name: "Soyosource maximum power demand"
      initial_value: 900
      max_value: 900
      restore_value: true
    power_demand_divider:
      name: "Soyosource power demand divider"
      initial_value: 1
      restore_value: true

switch:
  - platform: soyosource_virtual_meter
    soyosource_virtual_meter_id: virtualmeter0
    manual_mode:
      name: "Soyosource manual mode"
      restore_mode: RESTORE_DEFAULT_OFF
    emergency_power_off:
      id: emergency_power_off
      name: "Soyosource emergency power off"
      restore_mode: RESTORE_DEFAULT_OFF

text_sensor:
  - platform: soyosource_inverter
    soyosource_inverter_id: inverter0
    operation_status:
      name: "Soyosource operation status text"

  - platform: soyosource_virtual_meter
    soyosource_virtual_meter_id: virtualmeter0
    operation_mode:
      name: "Soyosource limiter operation mode"
